name: Feature proposal
description: Propose a scoped product improvement
title: "[Proposal]: "
labels: ["type: proposal", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and boundaries
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, compatibility, and operational impact
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
