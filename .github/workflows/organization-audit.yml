name: Organization Policy Audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-policy-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit organization and repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      evidence-outcome: ${{ steps.evidence.outcome }}
      policy-outcome: ${{ steps.policy.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve audited repository scope
        id: scope
        run: python3 scripts/resolve_repository_scope.py --github-output "$GITHUB_OUTPUT"

      - name: Require audit App configuration
        id: configuration
        shell: bash
        env:
          APP_SLUG: ${{ vars.POLICY_AUDIT_APP_SLUG }}
          CLIENT_ID: ${{ vars.POLICY_AUDIT_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.POLICY_AUDIT_APP_PRIVATE_KEY }}
        run: |
          [[ -n "$APP_SLUG" && -n "$CLIENT_ID" && -n "$PRIVATE_KEY" ]] || {
            echo 'Configure the complete Policy Auditor App credential group' >&2
            exit 1
          }

      - name: Audit App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.POLICY_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLICY_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-administration: read
          permission-contents: read
          permission-members: read
          permission-metadata: read
          permission-organization-administration: read

      - name: Audit App credential-scope token
        id: scope-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app] The action lacks an organization Variables selector; the App permission set is read-only and audited.
        with:
          client-id: ${{ vars.POLICY_AUDIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLICY_AUDIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] Full installation scope is required to detect missing or unexpected repositories by immutable ID.

      - name: Verify audit App identity
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          EXPECTED_APP_SLUG: ${{ vars.POLICY_AUDIT_APP_SLUG }}
          SCOPE_APP_SLUG: ${{ steps.scope-token.outputs.app-slug }}
        run: |
          [[ "$APP_SLUG" == "$EXPECTED_APP_SLUG" &&
            "$SCOPE_APP_SLUG" == "$EXPECTED_APP_SLUG" ]] || {
            echo "Unexpected audit App identity" >&2
            exit 1
          }

      - name: Audit hosted repository policy
        id: policy
        continue-on-error: true
        env:
          GH_SCOPE_TOKEN: ${{ steps.scope-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POLICY_AUDIT_APP_SLUG: ${{ vars.POLICY_AUDIT_APP_SLUG }}
          POLICY_AUDIT_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          set +e
          python3 scripts/audit_repository_policies.py \
            --json-output audit-report.json \
            --markdown-output audit-report.md
          status=$?
          set -e
          cat audit-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Retain audit evidence
        id: evidence
        if: >-
          always() &&
          (steps.policy.outcome == 'success' || steps.policy.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-policy-audit-${{ github.run_id }}
          path: |
            audit-report.json
            audit-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Require a compliant audited state
        if: always()
        env:
          APP_TOKEN: ${{ steps.app-token.outcome }}
          CONFIGURATION: ${{ steps.configuration.outcome }}
          POLICY_AUDIT: ${{ steps.policy.outcome }}
          SCOPE_TOKEN: ${{ steps.scope-token.outcome }}
        run: |
          [[ "$CONFIGURATION" == success ]] || {
            echo "Audit configuration failed: $CONFIGURATION" >&2
            exit 1
          }
          [[ "$APP_TOKEN" == success ]] || {
            echo "Audit App token failed: $APP_TOKEN" >&2
            exit 1
          }
          [[ "$SCOPE_TOKEN" == success ]] || {
            echo "Audit App scope token failed: $SCOPE_TOKEN" >&2
            exit 1
          }
          [[ "$POLICY_AUDIT" == success ]] || {
            echo "Repository policy drift was detected: $POLICY_AUDIT" >&2
            exit 1
          }

  reconcile:
    name: Reconcile central drift issue
    needs: audit
    if: >-
      always() &&
      needs.audit.outputs.evidence-outcome == 'success' &&
      (needs.audit.outputs.policy-outcome == 'success' ||
      needs.audit.outputs.policy-outcome == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Download only this run's policy evidence.
      contents: read
      issues: write # Create, update or close the single governance drift issue.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repository-policy-audit-${{ github.run_id }}
          path: audit-evidence

      - name: Reconcile the central drift issue
        env:
          AUDIT_ISSUE_REPOSITORY: ${{ github.repository }}
          AUDIT_OUTCOME: ${{ needs.audit.outputs.policy-outcome }}
          AUDIT_REPORT_JSON: ${{ github.workspace }}/audit-evidence/audit-report.json
          AUDIT_REPORT_MARKDOWN: ${{ github.workspace }}/audit-evidence/audit-report.md
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/reconcile_policy_audit_issue.sh
