name: Policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards:
    name: Organization standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK for Android signing material checks
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: false
      - name: Validate registry and tracked signing material
        run: python3 scripts/validate-signing-identities.py
      - name: Validate portable identity surfaces
        run: python3 scripts/audit_portability.py
      - name: Validate reviewed policy schema
        run: |
          uvx --from check-jsonschema==0.38.2 check-jsonschema \
            --check-metaschema schemas/repository-policies.schema.json
          uvx --from check-jsonschema==0.38.2 check-jsonschema \
            --schemafile schemas/repository-policies.schema.json \
            config/repository-policies.json
      - name: Validate Python quality
        run: |
          uvx --from ruff==0.17.2 ruff check scripts
          uvx --from ruff==0.17.2 ruff format --check scripts
      - name: Test repository policy automation
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          shellcheck scripts/*.sh
          bash scripts/test_reconcile_policy_audit_issue.sh
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .
          online-audits: false
          persona: pedantic
          version: 1.31.1
          advanced-security: false
          annotations: true

  required:
    name: Policy / Required
    if: always()
    needs: standards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every policy gate
        env:
          STANDARDS: ${{ needs.standards.result }}
        run: |
          [[ "$STANDARDS" == success ]] || {
            echo "Organization standards did not succeed: $STANDARDS" >&2
            exit 1
          }
